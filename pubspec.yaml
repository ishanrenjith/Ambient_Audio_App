name: conversation_awareness
description: "Ambient Audio — automatically duck media volume when you speak."
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  permission_handler: 11.4.0
  # Persists settings across app restarts using Android SharedPreferences
  # and iOS NSUserDefaults under the hood.
  shared_preferences: ^2.3.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true